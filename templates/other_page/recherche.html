{% extends 'base/base.html' %} {% load static %} {% block content %}

<!--  menu principal   -->

<!--  section entete   -->

<div id="carouselExampleCaptions" class="carousel slide" style="z-index: 1">
  <div class="carousel-inner">
    <div class="carousel-item active text-center">
      <img src="{% static 'media/about1.jpg' %}" class="d-block" alt="..."
        style="height: 350px; width: 100%; object-fit: cover" />
      <div class="carousel-caption d-none d-md-block vertical-center horizontal-center">
        <h1 class="display-5" style="
            position: absolute;
            top: -100px;
            font-family: poppins !important;
            color: white;
          ">
          {{service.service}}
        </h1>
      </div>
    </div>
  </div>
</div>

<!-- fin image entete-->

<!-- Site Static -->
<div class="container-fluid bg-light overflow-hidden px-lg-0" style="margin: 6rem 0">
  <div class="container feature px-lg-0">
    <div class="row g-0 mx-lg-0">
      <div class="col-lg-6 feature-text py-5 wow fadeIn" data-wow-delay="0.5s">
        <div class="p-lg-5 ps-lg-0">
          <div class="section-title text-start">
            <h3 class="display-7 mb-4">{{service.titre}}</h3>
          </div>
          <p class="mb-4 pb-2 text-justify">
            <strong></strong><br />
            {{service.description}}
          </p>
          <a href="{% url 'home' %}#devisacceuil" class="btn align-items-center"
            style="background-color: #2671f8; color: white">Passez une commande</a>
        </div>
      </div>
      <div class="col-lg-6 pe-lg-0" style="min-height: 400px">
        <div class="position-relative h-100">
          <img class="position-absolute img-fluid w-100 h-100" src="{{service.image.url}}" style="object-fit: cover"
            alt="" />
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
  <div class="container py-5">
    <div class="row g-5">
      <div class="col-lg-8">gauche</div>

      <!-- barre lateralle -->

      <div class="col-lg-4">
        <!-- Search Form Start -->
        <div class="mb-5 wow slideInUp" data-wow-delay="0.1s">
          <div class="input-group">
            <input type="text" class="form-control p-3" placeholder="Keyword" />
            <button class="btn px-4" style="background-color: #2671f8">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </div>
        <!-- Search Form End -->

        <!-- Category Start -->
        <div class="mb-5 wow slideInUp" data-wow-delay="0.1s">
          <div
            class="section-title section-title-sm position-relative pb-3 mb-4"
          >
            <h3 class="mb-0">Categories</h3>
          </div>
          <div class="link-animated d-flex flex-column justify-content-start">
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Web Design</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Web Development</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Web Development</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Keyword Research</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Email Marketing</a
            >
          </div>
        </div>
        <!-- Category End -->

        <!-- fin barre laterrale -->
      </div>
    </div>
  </div>
  <!-- fin pourquoi nous choisir -->

  {% endblock content %}
</div>
