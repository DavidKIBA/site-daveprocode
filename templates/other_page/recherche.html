{% extends 'base/base.html' %} {% load static %} {% block content %}

<!--  menu principal   -->

<!--  section entete   -->

<div id="carouselExampleCaptions" class="carousel slide" style="z-index: 1">
  <div class="carousel-inner">
    <div class="carousel-item active text-center">
      <img
        src="{% static 'media/about1.jpg' %}"
        class="d-block"
        alt="..."
        style="height: 350px; width: 100%; object-fit: cover"
      />
      <div
        class="carousel-caption d-none d-md-block vertical-center horizontal-center"
      >
        <h1
          class="display-5"
          style="
            position: absolute;
            top: -100px;
            font-family: poppins !important;
            color: white;
          "
        >
          {{service.service}}
        </h1>
      </div>
    </div>
  </div>
</div>

<!-- fin image entete-->

<!-- Site Static -->
<div
  class="container-fluid bg-light overflow-hidden px-lg-0"
  style="margin: 6rem 0"
>
  <div class="container feature px-lg-0"></div>
</div>

<!-- gauche -->

<div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
  <div class="container py-5">
    <div class="row g-5">
      <div class="col-lg-8">
        <!-- colonnes -->

        <div class="row g-0 mx-lg-0">
          <div
            class="col-lg-6 feature-text py-5 wow fadeIn"
            data-wow-delay="0.5s"
          >
            <div class="p-lg-5 ps-lg-0">
              
              <div class="section-title text-start">
                <a href="{% url 'service-detail' %}" style="text-decoration: none;"></a>
                <h3 class="display-7 mb-4">
                  Titre de la recherche {{service.titre}}
                </h3>
              </a>
              </div>
              <a href="{% url 'service-detail' %}" style="text-decoration: none;">
              <p class="mb-4 pb-2 text-justify">
                <strong></strong><br />
                description de la recherche effectuée par l'utilisateur
                {{service.description}}
              </p>
              </a>
            </div>
          </div>
          <div class="col-lg-6 pe-lg-0" style="min-height: 400px">
            <div class="position-relative h-100">
              <a href="{% url 'service-detail' %}">
                <img
                  class="position-absolute img-fluid w-100 h-100"
                  src="{% static 'media/about1.jpg' %}"
                  style="object-fit: cover"
                  alt=""
                />
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- barre lateralle -->

      <div class="col-lg-4">
        <!-- Search Form Start -->
        <div class="mb-5 wow slideInUp" data-wow-delay="0.1s">
          <div class="input-group">
            <input type="text" class="form-control p-3" placeholder="Keyword" />
            <button class="btn px-4" style="background-color: #2671f8">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </div>
        <!-- Search Form End -->

        <!-- Category Start -->
        <div class="mb-5 wow slideInUp" data-wow-delay="0.1s">
          <div
            class="section-title section-title-sm position-relative pb-3 mb-4"
          >
            <h3 class="mb-0">Categories</h3>
          </div>
          <div class="link-animated d-flex flex-column justify-content-start">
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Web Design</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" 
            href="{% url 'service' %}#serviceDeveloppementWeb"
              ><i class="bi bi-arrow-right me-2"></i> Development Web</a
            >
            <a class="h5 fw-semi-bold bg-light rounded py-2 px-3 mb-2" href="#"
              ><i class="bi bi-arrow-right me-2"></i>Marketing digital</a
            >
          
          </div>
        </div>
        <!-- Category End -->

        <!-- fin barre laterrale -->
      </div>
    </div>
  </div>
  <!-- fin pourquoi nous choisir -->

  {% endblock content %}
</div>
